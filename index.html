<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise generator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-div">
    <div class="content-div">
      <h1>Noise generator</h1>
      <div class="timer">
        <canvas id="timer-canvas"></canvas>
      </div>

      <h3>Presets</h3>
      <div class="row-div row-div-carousel">
        <button class="preset-button" onclick="applyPreset(presetDeepBrownian)"> Deep Brownian</button>
        <button class="preset-button" onclick="applyPreset(presetDeepPink)"> Deep Pink</button>
        <button class="preset-button" onclick="applyPreset(presetBrownian)">Brownian</button>
        <button class="preset-button" onclick="applyPreset(presetPink)">Pink</button>
      </div>

      <div class="row-div collapse" id="collapse">
        <p>Adjust </p>
        <p id="collapse-indicator">+</p>
      </div>
    
      <div class="collapsible-div">
        <div class="wrapper">
          <label>
            <div class="row-div row-div-spacebetween">
              Lowpass Frequency:
              <input type="number" id="freqNumber">
            </div>

            <input type="range" min="20" max="10000" value="5000" step="1" id="freqSlider">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            <div class="row-div row-div-spacebetween">
              Lowpass Q:
              <input type="number" id="qNumber">
            </div>

            <input type="range" min="0.01" max="5" value="0.5" step="0.01" id="qSlider">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            <div class="row-div row-div-spacebetween">
              Peak Filter Gain:
              <input type="number" min="-90" max="90" id="gainNumber2">
            </div>
            
            <input type="range" min="-90" max="90" value="0" step="1" id="gainSlider2">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            <div class="row-div row-div-spacebetween">
              Peak Filter Frequency:
              <input type="number" min="20" max="10000" id="freqNumber2">
            </div>
            
            <input type="range" min="20" max="10000" value="8000" step="1" id="freqSlider2">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            <div class="row-div row-div-spacebetween">
              Peak filter Q:
              <input type="number" min="0.01" max="5" id="qNumber2">
            </div>
             
            <input type="range" min="0.01" max="5" value="2.5" step="0.01" id="qSlider2">
          </label>
        </div>

       <div style="width: 100%; height: 300px;"></div>

      </div>
    </div>
  </div>

  <div class="main-div bottom-bar">
    <div class="content-div">
      <canvas id="spectrum" class="spectrum" width="600" height="300"></canvas>
    </div>
  </div>
  
  

  <script src="https://unpkg.com/@rive-app/webgl2@2.44.0"></script>
  <script src="scripts.js"></script>
  
</body>
</html>
