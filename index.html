<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noise generator</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="main-div">
    <div class="content-div">
      <h1>Noise generator</h1>
      <div class="row-div">
        <button onclick="startNoise()"> Play </button>
        <button onclick="stopNoise()">Stop</button>
      </div>

      <div class="row-div">
        <label>Set Timer</label>
        <input type="number" id="timerInput">
        <button id="start" onclick="timer(document.getElementById('timerInput').value)"> Start timer</button>
        <p id="clock" class="clock"> 00:00</p>
      </div>

      <div class="row-div collapse" id="collapse">
        <p>Adjust </p>
        <p>+</p>
      </div>
    
      <div class="collapsible-div">
        <div class="wrapper">
          <label>
            Lowpass Frequency: <br>
            <input type="range" min="20" max="20000" value="5000" step="1" id="freqSlider">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            Lowpass Q: <br>
            <input type="range" min="0.01" max="5" value="0.5" step="0.01" id="QSlider">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            Peak Filter Gain: <br>
            <input type="range" min="-200" max="200" value="0" step="1" id="GainSlider2">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            Peak Filter Frequency: <br>
            <input type="range" min="20" max="20000" value="8000" step="1" id="freqSlider2">
          </label>
        </div>
  
        <div class="wrapper">
          <label>
            Peak filter Q: <br>
            <input type="range" min="0.01" max="10" value="5" step="0.01" id="QSlider2">
          </label>
        </div>
  
        <div class="row-div">
        Presets
        </div>
      </div>
      

      <canvas id="spectrum" class="spectrum" width="600" height="300"></canvas>
    </div>
    

  </div>
  
  

  <script src="scripts.js"></script>
  
</body>
</html>
